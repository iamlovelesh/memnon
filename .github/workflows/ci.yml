name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - name: Build examples
        run: cargo build --examples

  features:
    name: lint (fastembed, tiktoken, hf-tokenizer features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Compile + lint the feature path. Pulls the ONNX stack but does NOT
      # download a model or run inference (that lives behind an #[ignore]d test;
      # run it manually with `--features fastembed -- --ignored`).
      - name: Clippy with fastembed
        run: cargo clippy --features fastembed --all-targets -- -D warnings
      - name: Clippy with tiktoken
        run: cargo clippy --features tiktoken --all-targets -- -D warnings
      - name: Clippy with hf-tokenizer
        run: cargo clippy --features hf-tokenizer --all-targets -- -D warnings

  coverage:
    name: coverage (report only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      - name: Coverage summary
        run: cargo llvm-cov --summary-only
