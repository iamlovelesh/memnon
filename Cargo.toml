[package]
name = "memnon"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
description = "Embeddable, local-first memory engine for AI agents — SQLite for agent memory."
repository = "https://github.com/iamlovelesh/memnon"
keywords = ["ai", "agents", "memory", "embeddings", "local-first"]
categories = ["database-implementations", "science"]
readme = "README.md"
# Integration tests (and their fixtures) aren't useful to downstream consumers
# and would otherwise ship a test that `include_bytes!`es an excluded fixture.
exclude = ["/tests", "/docs", "/.github", "/.superpowers"]

# Core deps are pure-Rust and light. The only native/heavy dependency,
# `fastembed` (ONNX), is optional and behind the `fastembed` feature.
[dependencies]
bincode = "1"
fastembed = { version = "7.7.1", optional = true }
redb = "5.0.0"
serde = { version = "1.0.229", features = ["derive"] }
tiktoken-rs = { version = "0.12.1", optional = true }
tokenizers = { version = "0.23.2", optional = true, default-features = false, features = [
    "fancy-regex",
] }

[dev-dependencies]
criterion = "0.8.2"
serde_json = "1.0.154"
tempfile = "3.27.0"
ureq = { version = "2", features = ["json"] }

[[bench]]
name = "recall"
harness = false

[[example]]
name = "semantic_quickstart"
required-features = ["fastembed"]

[features]
# Optional on-device semantic embedder (ONNX via fastembed). Pulls heavy native
# deps, so it's off by default: `cargo add memnon --features fastembed`.
fastembed = ["dep:fastembed"]
# Optional OpenAI-compatible BPE tokenizer (tiktoken-rs), off by default.
tiktoken = ["dep:tiktoken-rs"]
# Optional HuggingFace tokenizer (local tokenizer.json: BERT/Llama/etc.), off by default.
hf-tokenizer = ["dep:tokenizers"]
# Optional Hub-by-name download (fetches tokenizer.json over HTTP, then caches),
# off by default. Implies `hf-tokenizer`; enables `tokenizers`' own `http`
# feature, which pulls in `hf-hub` internally (no separate dependency needed here).
hf-hub = ["hf-tokenizer", "tokenizers/http"]
